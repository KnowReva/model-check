[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-check"
version = "0.1.1"
description = "Which local AI model is good enough for your task? Measured on your own examples (Ollama)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "KnowReva" }]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
model-check = "model_check.cli:main"

[project.urls]
Homepage = "https://knowreva.com/open-source/"
Source = "https://github.com/knowreva/model-check"

[tool.setuptools]
packages = ["model_check"]

[tool.setuptools.package-data]
model_check = ["tasks/*/*.toml", "tasks/*/*.jsonl"]
